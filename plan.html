<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="logo_on_dark.png">
<script src="config.js"></script>
<title>Réservations · BUFFALO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout : en-tête de service (date, service, soir de match, jauge), puis le plan d'architecte à gauche et le carnet de réservations à droite ; empilés sur téléphone. Identité BUFFALO, un seul thème sombre assumé (écran de salle). */
:root{
  --bg:#121110; --panel:#1b1918; --card:#24201e; --line:#3a332f; --wall:#8d8378;
  --red:#e3232b; --red-soft:rgba(227,35,43,.22); --cream:#f6eedd; --muted:#a99f93;
  --amber:#e9a53a; --amber-soft:rgba(233,165,58,.22); --green:#3fae63; --green-soft:rgba(63,174,99,.2);
  --tabletop:#2f2a27; --chair:#4a423d; --terrace:#171c16; --hatch:#2a2522;
  --display:"Teko","Oswald","Arial Narrow",sans-serif;
  --body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg);color:var(--cream)}
body{font-family:var(--body);font-size:16px;line-height:1.3;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 90px;
  background:radial-gradient(80% 40% at 100% 0%, rgba(227,35,43,.10), transparent 60%), var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.d{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:.95}
.muted{color:var(--muted)}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* En-tête */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.top img{width:56px;height:auto}
.top h1{margin:0;font-size:38px}
.top .sub{color:var(--muted);font-size:15px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:min(240px,100%)}
.brand>div{min-width:0}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.datenav{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.datenav button{padding:8px 12px;font-size:18px}
.datenav button:hover{background:var(--card)}
.datenav input{background:transparent;border:0;padding:6px 4px;width:150px;text-align:center;font-weight:600;color-scheme:dark}
.datelbl{font-weight:700;text-transform:capitalize;min-width:170px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:7px 12px 3px;border-radius:9px;font-family:var(--display);font-size:21px;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.match{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.match[aria-pressed="true"]{background:var(--red-soft);border-color:var(--red)}
.sw{width:40px;height:22px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--cream);transition:left .15s}
.match[aria-pressed="true"] .sw{background:var(--red)}
.match[aria-pressed="true"] .sw::after{left:21px}

/* Jauge */
.gauge{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.gauge .big{font-family:var(--display);font-size:34px;line-height:.9;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:999px;background:var(--card);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:999px}
.bar i.warn{background:var(--amber)}.bar i.full{background:var(--red)}
.gauge .note{grid-column:1/-1;color:var(--muted);font-size:14px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.stats b{color:var(--cream);font-variant-numeric:tabular-nums}

/* Corps */
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:1000px){.main{grid-template-columns:minmax(0,1fr)}}
.planbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;min-width:0}
.planbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.tabs{display:flex;gap:6px}
.tabs button{padding:7px 14px 3px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-family:var(--display);font-size:21px;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--cream);color:var(--cream)}
.timepick{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.timepick select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-variant-numeric:tabular-nums}
.timepick button{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700}
svg.plan{width:100%;height:auto;display:block;touch-action:manipulation}
#planWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:700px){svg.plan{width:880px;max-width:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:2px solid transparent}
.lg-free{background:var(--tabletop);border-color:var(--chair)!important}
.lg-resa{background:var(--red-soft);border-color:var(--red)!important}
.lg-soon{background:var(--amber-soft);border-color:var(--amber)!important}
.lg-in{background:var(--red)}
.lg-sel{background:var(--green-soft);border-color:var(--green)!important}

/* Tables SVG */
.scen-wall{fill:none;stroke:var(--wall);stroke-width:10;stroke-linecap:square}
.scen-fill{fill:var(--hatch);stroke:var(--line);stroke-width:3}
.scen-terr{fill:var(--terrace);stroke:var(--line);stroke-width:3;stroke-dasharray:14 10}
.scen-void{fill:url(#hatch);stroke:var(--wall);stroke-width:4}
.scen-bar{fill:#3a2f2a;stroke:var(--wall);stroke-width:3}
.scen-lbl{fill:var(--muted);font-family:var(--body);font-weight:700;font-size:30px;letter-spacing:.08em;text-transform:uppercase}
.scen-lbl.sm{font-size:22px}
.stool{fill:var(--chair);stroke:var(--line);stroke-width:2}
.seam{stroke:var(--line);stroke-width:3;stroke-dasharray:6 6;pointer-events:none}
.tbl{cursor:pointer}
.tbl .top{fill:var(--tabletop);stroke:var(--chair);stroke-width:4}
.tbl .chair{fill:var(--chair)}
.tbl .num{fill:var(--cream);font-family:var(--display);font-size:46px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tbl .who{fill:var(--cream);font-family:var(--body);font-weight:700;font-size:21px;text-anchor:middle;pointer-events:none}
.tbl .halo{fill:transparent}
.tbl:hover .top{stroke:var(--cream)}
.tbl.resa .top{fill:var(--red-soft);stroke:var(--red)}
.tbl.soon .top{fill:var(--amber-soft);stroke:var(--amber)}
.tbl.in .top{fill:var(--red);stroke:var(--red)}
.tbl.in .chair{fill:#8a2a2e}
.tbl.sel .top{fill:var(--green-soft);stroke:var(--green);stroke-width:7}
.tbl.busy{opacity:.35;cursor:not-allowed}
.tbl.focus .top{stroke:var(--cream);stroke-width:7}
.tbl.haute .top{stroke-dasharray:10 6}

/* Panneau */
.side{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sideh{display:flex;align-items:center;gap:8px}
.sideh h2{margin:0;font-size:30px;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px 6px;border-radius:11px;font-family:var(--display);font-size:21px;text-transform:uppercase}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.ghost{border:1px solid var(--line);background:var(--card)}
.btn.sm{font-size:18px;padding:7px 10px 4px}
.back{color:var(--muted);font-weight:700;text-align:left}
.empty{color:var(--muted);text-align:center;padding:26px 8px;border:1px dashed var(--line);border-radius:12px}
.rlist{display:flex;flex-direction:column;gap:6px}
.rrow{display:grid;grid-template-columns:minmax(52px,auto) minmax(0,1fr) auto;gap:4px 10px;align-items:center;text-align:left;width:100%;padding:9px 10px;border-radius:11px;background:var(--card);border:1px solid var(--line)}
.rrow:hover{border-color:var(--muted)}
.rrow .t{font-family:var(--display);font-size:26px;line-height:.9;font-variant-numeric:tabular-nums}
.rrow .n{font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .m{color:var(--muted);font-size:14px}
.rrow.ended{opacity:.5}
.pill{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:6px;white-space:nowrap;background:var(--line)}
.pill.confirmee{background:var(--red-soft);color:#ffc9cb}
.pill.arrivee{background:var(--red);color:#fff}
.pill.terminee{background:var(--line);color:var(--muted)}
.pill.noshow{background:var(--amber-soft);color:var(--amber)}
.pill.annulee{background:var(--line);color:var(--muted);text-decoration:line-through}
.pill.demande{background:var(--amber);color:#1a1205}
.pill.refusee{background:var(--line);color:var(--muted);text-decoration:line-through}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--card);border:1px solid var(--line);color:var(--muted);margin-left:4px}
.pending{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--amber-soft);border:1px solid var(--amber);color:#ffd99a;border-radius:12px;padding:10px 14px;font-weight:600}
.pending button{color:#ffd99a;text-decoration:underline;font-weight:700}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px}
.login .box{width:min(340px,100%);text-align:center}
.login img{width:100px}
.dots{display:flex;gap:12px;justify-content:center;margin:16px 0}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--red);border-color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:62px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-family:var(--display);font-size:32px}
.lmsg{min-height:22px;color:#ffb6b9;font-weight:600;margin-top:10px}
.navlinks{display:flex;gap:8px}
.navlinks a{color:var(--muted);font-weight:700;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;font-size:16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.copy{margin-left:6px;font-size:13px;color:var(--muted);text-decoration:underline}
form{display:flex;flex-direction:column;gap:10px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:14px;color:var(--muted);font-weight:600}
.frow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.frow2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;color-scheme:dark}
textarea{min-height:56px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:var(--green-soft);border:1px solid var(--green);font-weight:700}
.chip button{color:var(--muted);font-size:15px}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{display:flex;justify-content:space-between;gap:8px;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.sugg button:hover{border-color:var(--green)}
.sugg b{font-weight:700}
.msg{border-radius:10px;padding:8px 10px;font-weight:600;font-size:15px}
.msg.err{background:rgba(227,35,43,.18);color:#ffc0c3}
.msg.warn{background:var(--amber-soft);color:#ffd99a}
.msg.info{background:var(--card);color:var(--muted)}
.pickbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));background:var(--panel);border-top:3px solid var(--green);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pickbar .txt{flex:1;min-width:200px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--cream);color:#151210;padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.alerts{display:flex;flex-direction:column;gap:8px}
.alerts:not(:empty){margin-bottom:12px}
.al{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;border-radius:12px;padding:10px 14px;border:2px solid var(--amber);background:var(--amber-soft);color:#ffe2ad}
.al.now{border-color:var(--amber);background:rgba(233,165,58,.34)}
.al.late{border-color:var(--red);background:rgba(227,35,43,.26);color:#ffd5d7;animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.al.late{animation:none}}
.al.ok{border-color:var(--green);background:var(--green-soft);color:#c9f0d6}
.al .when{font-family:var(--display);font-size:30px;line-height:1;min-width:104px}
.al .who{flex:1;min-width:200px;font-weight:600}
.al .who b{font-size:17px}
.al .who a{color:inherit;font-weight:700}
.al .ab{display:flex;gap:8px;flex-wrap:wrap}
.al button.x{background:rgba(0,0,0,.28);color:inherit;border:1px solid currentColor;border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px;min-height:42px}
.al button.go{background:var(--green);color:#06240f;border:0;border-radius:10px;padding:9px 16px;font-weight:800;font-size:15px;min-height:42px}
@keyframes pulse{50%{background:rgba(227,35,43,.42)}}
.tbl.late .top{fill:rgba(227,35,43,.5);stroke:var(--red);stroke-width:8;stroke-dasharray:16 9}
.lg-late{background:rgba(227,35,43,.5);border:2px dashed var(--red)!important}
.cd{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:800;background:var(--amber);color:#1a1205}
.cd.late{background:var(--red);color:#fff}.cd.ok{background:var(--green);color:#06240f}
.snd{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;color:var(--muted)}
.snd[aria-pressed="true"]{color:var(--cream);border-color:var(--green)}
.banner{background:var(--amber-soft);color:#ffd99a;border-radius:12px;padding:10px 14px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="login" id="login" hidden><div class="box"><img src="logo_on_dark.png" alt="BUFFALO"><h1 class="d" style="font-size:38px;margin:10px 0 4px">Réservations</h1><div class="muted">Code PIN équipe</div><div class="dots" id="dots"></div><div class="pad" id="pad"></div><div class="lmsg" id="lmsg"></div></div></div>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <img src="logo_on_dark.png" alt="BUFFALO Sports Bar">
      <div><h1 class="d">Réservations</h1><div class="sub">RDC tables 100 · R+1 tables 200</div></div>
    </div>
    <div class="ctl">
      <nav class="navlinks" aria-label="Écrans"><a href="equipe.html">Cuisine / bar</a><a href="fidelite.html">Fidélité</a></nav>
      <div class="datenav"><button id="prevDay" aria-label="Jour précédent">‹</button><input type="date" id="dateIn" aria-label="Date"><button id="nextDay" aria-label="Jour suivant">›</button></div>
      <button class="btn ghost sm" id="todayBtn">Aujourd'hui</button>
      <div class="seg" role="group" aria-label="Service"><button data-svc="matin">Matin</button><button data-svc="midi">Midi</button><button data-svc="soir">Soir</button></div>
      <button class="snd" id="sndBtn" aria-pressed="true">Son des alertes : oui</button>
      <button class="match" id="matchBtn" aria-pressed="false"><span class="sw"></span>Soir de match</button>
    </div>
  </header>
  <div id="banner"></div>
  <div class="alerts" id="alerts" aria-live="assertive"></div>
  <div id="pending"></div>
  <section class="gauge" aria-label="Remplissage du service">
    <div><div class="big" id="gNum">0 / 212</div><div class="muted" style="font-size:13px" id="gLbl">couverts réservés</div></div>
    <div class="bar"><i id="gBar" style="width:0%"></i></div>
    <div class="stats" id="gStats"></div>
    <div class="note" id="gNote"></div>
  </section>

  <div class="main">
    <section class="planbox" aria-label="Plan">
      <div class="planbar">
        <div class="tabs" role="tablist"><button role="tab" data-zone="rdc">RDC · 100</button><button role="tab" data-zone="mez">R+1 · 200</button></div>
        <div class="timepick"><label for="timeSel">Situation à</label><select id="timeSel"></select><button id="nowBtn">Maintenant</button></div>
      </div>
      <div id="planWrap"></div>
      <div class="legend"><span><i class="lg-free"></i>Libre</span><span><i class="lg-soon"></i>Arrive dans moins de 45 min</span><span><i class="lg-late"></i>Client en retard</span><span><i class="lg-resa"></i>Réservée</span><span><i class="lg-in"></i>Clients installés</span><span><i class="lg-sel"></i>Sélection</span><span>Pointillés : table haute</span></div>
    </section>
    <aside class="side" id="side" aria-live="polite"></aside>
  </div>
</div>
<div id="pickbar"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== Plan (plan d'aménagement RDC / R+1 du 11/11/2026) ===================== */
// k: d = carrée en losange (4), r = rectangle, o = ronde ; c = chaises [haut, bas, gauche, droite]
const TABLES = [
  // RDC (rez-de-chaussée) : plan d'aménagement du 11/11/2026
  {n:100,z:"rdc",a:"RDC",x:1090,y:260,k:"r",w:74,h:148,c:[0,0,2,2],s:4},
  {n:101,z:"rdc",a:"RDC",x:1310,y:260,k:"r",w:74,h:148,c:[0,0,2,2],s:4},
  {n:102,z:"rdc",a:"RDC",x:1530,y:260,k:"r",w:74,h:148,c:[0,0,2,2],s:4},
  {n:103,z:"rdc",a:"RDC",x:1750,y:260,k:"r",w:74,h:148,c:[0,0,2,2],s:4},
  {n:104,z:"rdc",a:"RDC",x:1100,y:500,k:"r",w:148,h:74,c:[2,2,0,0],s:4},
  {n:105,z:"rdc",a:"RDC",x:1400,y:500,k:"r",w:148,h:74,c:[2,2,0,0],s:4},
  {n:106,z:"rdc",a:"RDC",x:1690,y:500,k:"r",w:74,h:74,c:[1,1,0,0],s:2},
  {n:107,z:"rdc",a:"RDC",x:900,y:700,k:"r",w:74,h:74,c:[1,1,0,0],s:2},
  {n:108,z:"rdc",a:"RDC",x:1270,y:700,k:"r",w:148,h:74,c:[2,2,0,0],s:4},
  {n:109,z:"rdc",a:"RDC",x:1590,y:700,k:"r",w:74,h:74,c:[1,1,0,0],s:2},
  {n:110,z:"rdc",a:"RDC",x:2200,y:890,k:"r",w:74,h:74,c:[1,1,0,0],s:2},
  // R+1 (étage)

function chairRect(cx, cy, w, h){ return `<rect class="chair" x="${cx - w/2}" y="${cy - h/2}" width="${w}" height="${h}" rx="5"/>`; }
function drawTable(t, cls, label, ext){
  const CW = 30, CD = 22, G = 6; let g = "";
  if (ext && t.k === "r") { const c = [...t.c]; if (t.w >= t.h) { c[2] = Math.max(c[2], 1); c[3] = Math.max(c[3], 1); } else { c[0] = Math.max(c[0], 1); c[1] = Math.max(c[1], 1); } t = { ...t, c }; }
  if (t.k === "d") {

    g += chairRect(t.x, t.y - S2/2 - G - CD/2, CW+8, CD) + chairRect(t.x, t.y + S2/2 + G + CD/2, CW+8, CD) + chairRect(t.x - S2/2 - G - CD/2, t.y, CD, CW+8) + chairRect(t.x + S2/2 + G + CD/2, t.y, CD, CW+8);
    g += `<rect class="top" x="${t.x - S2/2}" y="${t.y - S2/2}" width="${S2}" height="${S2}" rx="4"/></g>`;
  } else if (t.k === "o") {
    for (let i = 0; i < (t.haute ? 0 : t.s); i++) { const a = (i / t.s) * 2 * Math.PI - Math.PI/2, R = t.r + G + CD/2;
      g += `<rect class="chair" x="${t.x + R*Math.cos(a) - CW/2}" y="${t.y + R*Math.sin(a) - CD/2}" width="${CW}" height="${CD}" rx="5" transform="rotate(${a*180/Math.PI + 90} ${t.x + R*Math.cos(a)} ${t.y + R*Math.sin(a)})"/>`; }
    g += `<circle class="top" cx="${t.x}" cy="${t.y}" r="${t.r}"/>`;
  } else {
    const [ct, cb, cl, cr] = t.c, x0 = t.x - t.w/2, y0 = t.y - t.h/2;
    for (let i = 0; i < ct; i++) g += chairRect(x0 + t.w*(i+.5)/ct, y0 - G - CD/2, CW, CD);
    for (let i = 0; i < cb; i++) g += chairRect(x0 + t.w*(i+.5)/cb, y0 + t.h + G + CD/2, CW, CD);
    for (let i = 0; i < cl; i++) g += chairRect(x0 - G - CD/2, y0 + t.h*(i+.5)/cl, CD, CW);
    for (let i = 0; i < cr; i++) g += chairRect(x0 + t.w + G + CD/2, y0 + t.h*(i+.5)/cr, CD, CW);
    g += `<rect class="top" x="${x0}" y="${y0}" width="${t.w}" height="${t.h}" rx="4"/>`;
    if (t.w > 74 || t.h > 74) for (let i = 1; i < Math.round(Math.max(t.w, t.h) / 74); i++) g += t.w > t.h ? `<line class="seam" x1="${x0 + 74*i}" y1="${y0 + 8}" x2="${x0 + 74*i}" y2="${y0 + t.h - 8}"/>` : `<line class="seam" x1="${x0 + 8}" y1="${y0 + 74*i}" x2="${x0 + t.w - 8}" y2="${y0 + 74*i}"/>`;
    if (t.rot) g = `<g transform="rotate(${t.rot} ${t.x} ${t.y})">${g}</g>`;
  }
  const big = (t.k === "r" && Math.min(t.w, t.h) < 80 && Math.max(t.w, t.h) < 80) || (t.k === "o" && t.r < 50);
  const ny = label ? t.y - 10 : t.y;
  g += `<circle class="halo" cx="${t.x}" cy="${t.y}" r="70"/>`;
  g += `<text class="num" x="${t.x}" y="${ny}" style="${big ? "font-size:36px" : ""}">${t.n}</text>`;
  if (label) g += `<text class="who" x="${t.x}" y="${t.y + 30}">${esc(label)}</text>`;

function renderPlan(){
  const sc = SCENE[S.zone];

  const busy = pickIv ? busyFor(pickIv, S.draft.id) : null;
  let tables = "";
  for (const t of TABLES.filter(t => t.z === S.zone)) {
    let cls = "", label = "", ext = false;
    if (S.picking) {
      if (S.draft.tables.includes(t.n)) { cls = "sel"; ext = extOf(S.draft).includes(t.n); }
      else if (busy.has(t.n)) cls = "busy";
      label = (ext ? 6 : t.s) + " pl.";
    } else {
      const st = tableState(t.n); cls = st.cls;
      label = st.r ? (st.r.name || "").split(" ")[0].slice(0, 9) + " · " + st.r.covers : "";
      ext = !!st.r && extOf(st.r).includes(t.n);
      if (S.mode === "table" && S.tableN === t.n) cls += " focus";
      if (S.mode === "detail" && S.sel && (S.resas.find(r => r.id === S.sel)?.tables || []).includes(t.n)) cls += " focus";

// 30 min avant : préparer la table. 15 min avant : arrivée imminente. 10 min après l'heure : client en retard.
const PREP_MIN = 30, SOON_MIN = 15, LATE_MIN = 10;
function alertOf(r){
  if (r.status !== "confirmee" || r.date !== todayNC()) return null;
  const d = toMin(r.time) - nowMinNC();           // minutes avant l'arrivée (négatif = heure dépassée)
  if (d > PREP_MIN || d < -240) return null;
  const lvl = d <= -LATE_MIN ? "late" : d <= 0 ? "now" : d <= SOON_MIN ? "soon" : "prep";
  return { lvl, d };
}
function cdBadge(r){
  const a = alertOf(r); if (!a) return "";
  if (a.lvl === "late") return `<span class="cd late">retard ${-a.d} min</span>`;
  if (a.lvl === "now") return `<span class="cd">attendu maintenant</span>`;
  return `<span class="cd ${r.prete ? "ok" : ""}">dans ${a.d} min${r.prete ? " · table prête" : ""}</span>`;
}
let audioCtx = null, soundOn = store.get("plan_son") !== "0";
function beep(late){
  if (!soundOn) return;
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume();
    const t0 = audioCtx.currentTime; (late ? [0, .22, .44] : [0, .25]).forEach((dt, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = late ? 880 : (i ? 784 : 587); g.gain.setValueAtTime(.0001, t0 + dt); g.gain.exponentialRampToValueAtTime(.25, t0 + dt + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + dt + .18);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0 + dt); o.stop(t0 + dt + .2); }); } catch(e) {}
}
const rung = new Map(); // id -> dernier palier déjà sonné
function renderAlerts(){
  const el = $("#alerts"); if (!el) return;
  const rank = { prep:1, soon:2, now:3, late:4 };
  const list = (S.today || []).map(r => ({ r, a: alertOf(r) })).filter(x => x.a).sort((x,y) => x.a.d - y.a.d);
  let ring = 0;
  for (const { r, a } of list) { const prev = rung.get(r.id) || 0, quiet = r.prete && a.lvl !== "late"; if (rank[a.lvl] > prev) { rung.set(r.id, rank[a.lvl]); if (!quiet) ring = Math.max(ring, a.lvl === "late" ? 2 : 1); } }
  if (ring && S.alertsReady) beep(ring === 2);
  S.alertsReady = true;
  el.innerHTML = list.map(({ r, a }) => {
    const tb = tlabelX(r), tel = r.phone ? `<a href="tel:${esc(String(r.phone).replace(/[^+\d]/g, ""))}">${esc(r.phone)}</a>` : "pas de téléphone";

      <span class="ab"><button class="go" data-al-ok="${esc(r.id)}">OK, client arrivé</button><button class="x" data-al-no="${esc(r.id)}">Pas venu : libérer la table</button></span></div>`;
    const ok = r.prete && a.lvl !== "now";
    return `<div class="al ${ok ? "ok" : a.lvl}" role="status"><span class="when">${a.lvl === "now" ? "Maintenant" : a.d + " min"}</span><span class="who"><b>${esc(r.name)}</b> ${a.lvl === "now" ? "est attendu" : "arrive"} à ${esc(r.time)} · ${r.covers} pers. · ${tb}${extOf(r).length ? " · ajouter 2 chaises" : ""}${r.note ? " · " + esc(r.note) : ""}<br>${r.prete ? "Table prête ✓" : "Préparer la table"}</span>
      <span class="ab">${r.prete ? "" : `<button class="x" data-al-pr="${esc(r.id)}">Table prête</button>`}<button class="go" data-al-ok="${esc(r.id)}">OK, client arrivé</button></span></div>`;
  }).join("");
  el.querySelectorAll("[data-al-ok]").forEach(b => b.onclick = () => quick(b.dataset.alOk, "arrivee", "Client arrivé"));

function suggestions(){
  const d = S.draft, iv = interval(d), busy = busyFor(iv, d.id), cov = Math.max(1, d.covers);
  const free = TABLES.filter(t => !busy.has(t.n) && (d.pref === "any" || t.a === d.pref) && !(t.haute && (cov > 2 || S.day.match)));
  const singles = free.filter(t => t.s >= cov).sort((a,b) => (a.s - b.s) || a.n - b.n).slice(0, 4).map(t => ({ tables: [t.n], seats: t.s }));
  if (cov === 5 || cov === 6) for (const t of free.filter(t => canExt(t.n)).sort((a,b) => a.n - b.n).slice(0, Math.max(2, 5 - singles.length))) singles.push({ tables: [t.n], seats: 6, ext: true });
  if (singles.length >= 2 || cov <= 4) return singles.slice(0, 5);
  const pairs = [];
  for (let i = 0; i < free.length; i++) for (let j = i + 1; j < free.length; j++) {
    const a = free[i], b = free[j]; if (a.z !== b.z || a.a !== b.a) continue;
    const dist = Math.hypot(a.x - b.x, a.y - b.y); if (dist > 330) continue;
    const s = a.s + b.s; if (s < cov) continue;
    pairs.push({ tables: [a.n, b.n], seats: s, dist });
  }
  pairs.sort((p,q) => (p.seats - q.seats) || (p.dist - q.dist));
  return [...singles, ...pairs.slice(0, 4 - singles.length)];
}

}

const CFG = window.BUFFALO;
async function rpc(fn, args={}) {
  const r = await fetch(`${CFG.SUPABASE_URL}/rest/v1/rpc/${fn}`, { method:"POST", headers:{ apikey:CFG.SUPABASE_KEY, "Content-Type":"application/json" }, body: JSON.stringify(args) });
  const j = await r.json().catch(() => null);
  if (!r.ok) { const m = String(j?.message || "Connexion impossible"); throw new Error(m.replace(/^.*?ERROR:\s*(P0001:\s*)?/, "")); }
  return j;
}
let pollT = null, loadSeq = 0;
async function loadDay(){
  clearTimeout(pollT);
  if (!S.pin) return;
  const date = S.date, my = ++loadSeq;
  try {
    const d = await rpc("staff_resas", { p_pin: S.pin, p_date: date });
    if (d === null) { logout(); return; }
    if (my !== loadSeq || date !== S.date) return;
    S.resas = d.resas; if (date === todayNC()) S.today = d.resas; S.day = d.jour || {}; S.pending = d.prochaines_demandes || []; S.pendingCount = d.demandes || 0; S.loaded = true;
    $("#banner").innerHTML = "";
    renderAll();
  } catch(e) { $("#banner").innerHTML = `<div class="banner">Connexion perdue, nouvel essai dans quelques secondes. (${esc(e.message)})</div>`; }
  pollT = setTimeout(loadDay, 10000);
}
function subscribeDay(){ S.loaded = false; S.resas = []; S.day = {}; renderAll(); loadDay(); loadToday(); }
function renderPending(){
  const el = $("#pending"); if (!el) return;
  if (!S.pendingCount) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="pending"><span>${S.pendingCount} demande${S.pendingCount > 1 ? "s" : ""} en ligne à valider :</span>${S.pending.map(p => `<button data-pd="${p.date}" data-pt="${p.time}">${new Date(p.date + "T12:00:00Z").toLocaleDateString("fr-FR", { day:"numeric", month:"short", timeZone:"UTC" })} ${p.time} · ${esc(p.name)} (${p.covers})</button>`).join("")}</div>`;
  el.querySelectorAll("[data-pd]").forEach(b => b.onclick = () => { S.svc = svcOf(b.dataset.pt); S.time = b.dataset.pt; S.mode = "list"; if (b.dataset.pd !== S.date) { S.date = b.dataset.pd; subscribeDay(); } else renderAll(); });
}

/* ---------- Connexion PIN (partagée avec l'écran équipe) ---------- */
const ss = { get(k){ try { return sessionStorage.getItem(k); } catch(e) { return null; } }, set(k,v){ try { sessionStorage.setItem(k,v); } catch(e) {} }, del(k){ try { sessionStorage.removeItem(k); } catch(e) {} } };
let entry = "";
function drawDots(){ $("#dots").innerHTML = Array.from({ length: Math.max(4, entry.length) }, (_,i) => `<i class="${i < entry.length ? "on" : ""}"></i>`).join(""); }
function showLogin(){ $("#login").hidden = false; entry = ""; drawDots(); }
function logout(){ ss.del("buffalo_pin"); S.pin = null; clearTimeout(pollT); clearTimeout(todayT); showLogin(); }
async function submitPin(){
  $("#lmsg").textContent = "";
  if (entry.length < 4) { $("#lmsg").textContent = "4 chiffres minimum"; return; }
  try { const ok = await rpc("staff_login", { p_pin: entry });
    if (!ok) { $("#lmsg").textContent = "Code incorrect"; entry = ""; drawDots(); return; }
    S.pin = entry; ss.set("buffalo_pin", entry); entry = ""; $("#login").hidden = true; subscribeDay();
  } catch(e) { $("#lmsg").textContent = e.message; entry = ""; drawDots(); }
}
$("#pad").innerHTML = ["1","2","3","4","5","6","7","8","9","⌫","0","OK"].map(k => `<button data-k="${k}">${k}</button>`).join("");
$("#pad").onclick = e => { const k = e.target.dataset?.k; if (!k) return; if (k === "⌫") entry = entry.slice(0,-1); else if (k === "OK") return submitPin(); else if (entry.length < 6) entry += k; drawDots(); };
document.addEventListener("keydown", e => { if ($("#login").hidden) return; if (/^\d$/.test(e.key) && entry.length < 6) entry += e.key; else if (e.key === "Backspace") entry = entry.slice(0,-1); else if (e.key === "Enter") return submitPin(); drawDots(); });

/* ===================== Rendu global et contrôles ===================== */
function renderAll(){ renderHeader(); renderPlan(); renderSide(); renderPickbar(); renderPending(); renderAlerts(); }
function changeDate(d){ if (!d || d === S.date) return; S.date = d; if (S.mode !== "form") { S.mode = "list"; } subscribeDay(); renderAll(); }
$("#prevDay").onclick = () => changeDate(addDays(S.date, -1));
$("#nextDay").onclick = () => changeDate(addDays(S.date, 1));
$("#dateIn").onchange = e => changeDate(e.target.value);
$("#todayBtn").onclick = () => changeDate(todayNC());
document.querySelectorAll("[data-svc]").forEach(b => b.onclick = () => { S.svc = b.dataset.svc; S.time = SERVICES[S.svc].def; if (S.mode === "table" || S.mode === "detail") S.mode = "list"; renderAll(); });
$("#timeSel").onchange = e => { S.time = e.target.value; renderPlan(); if (S.mode === "table") renderSide(); };
$("#nowBtn").onclick = () => { const m = nowMinNC(); S.date !== todayNC() && changeDate(todayNC()); S.svc = svcOf(fromMin(m)); S.time = fromMin(Math.max(SERVICES[S.svc].from, m - m % 15)); renderAll(); };
document.querySelectorAll("[data-zone]").forEach(b => b.onclick = () => { S.zone = b.dataset.zone; store.set("plan_zone", S.zone); renderPlan(); });
$("#matchBtn").onclick = async () => { const v = !S.day.match; if (await act(() => rpc("staff_set_jour", { p_pin: S.pin, p_date: S.date, p_match: v }), v ? "Soir de match activé" : "Soir de match désactivé")) loadDay(); };
setInterval(() => { renderAlerts(); if (S.date === todayNC() && !S.picking && S.mode !== "form") { renderPlan(); if (S.mode === "list") renderSide(); } }, 20000);
function drawSnd(){ const b = $("#sndBtn"); b.setAttribute("aria-pressed", soundOn); b.textContent = "Son des alertes : " + (soundOn ? "oui" : "non"); }
$("#sndBtn").onclick = () => { soundOn = !soundOn; store.set("plan_son", soundOn ? "1" : "0"); drawSnd(); if (soundOn) beep(false); };
drawSnd();

renderAll();
(async () => {
  const saved = ss.get("buffalo_pin");
  if (saved) { try { if (await rpc("staff_login", { p_pin: saved })) { S.pin = saved; $("#login").hidden = true; subscribeDay(); return; } } catch(e) {} ss.del("buffalo_pin"); }
  showLogin();
})();
</script>

</body>
